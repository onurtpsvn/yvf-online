<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>YvF Online</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <!-- iPhone Safari oyunlara tam ekran API'si vermiyor: "Ana Ekrana Ekle" ile açılınca
         Safari çubukları olmadan (uygulama gibi) açılması için. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YvF Online">
    <link rel="apple-touch-icon" href="TemplateData/icons/unity-logo-dark.png">
    <style>
      #yvf-install-hint { display: none; position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
        max-width: 92%; padding: 10px 40px 10px 14px; border-radius: 10px; background: rgba(20, 20, 28, 0.92);
        color: #fff; font: 15px -apple-system, sans-serif; line-height: 1.35; z-index: 10; }
      #yvf-install-hint button { position: absolute; right: 6px; top: 6px; border: 0; background: none;
        color: #fff; font-size: 20px; line-height: 1; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="yvf-install-hint">
        Tam ekran için: Safari'de <b>Paylaş</b> → <b>Ana Ekrana Ekle</b>, sonra oyunu ana ekrandaki
        <b>YvF Online</b> simgesinden aç. Telefonu yan çevir.
        <button type="button" aria-label="Kapat" onclick="this.parentElement.style.display='none'">×</button>
      </div>
    </div>
    <script>
      // Service worker bilerek YOK: oyun dosyalarını önbelleğe alıp yeni sürüm yüklendikten
      // sonra eski sürümün açılmasına yol açıyordu.

      // iPhone/iPad Safari'de (ana ekrandan açılmamışsa) tam ekran ipucunu göster.
      var isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var isStandalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      if (isIos && !isStandalone) {
        document.querySelector("#yvf-install-hint").style.display = "block";
      }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "YvF Online",
        productVersion: "1.0.44",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
